<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 245" role="img" aria-labelledby="title desc">
  <title id="title">DirectOut IOX.2 extension front panel</title>
  <desc id="desc">Vector front panel for an IOX.2 extension unit.</desc>
  <defs>
    <style>
      .panel { fill: #fff; stroke: #181818; stroke-width: 1.6; }
      .line { fill: none; stroke: #181818; stroke-width: 2; }
      .thin { fill: none; stroke: #555; stroke-width: 1; }
      .label { fill: #262626; font: 600 11px Arial, sans-serif; letter-spacing: .45px; }
      .tiny { fill: #303030; font: 600 9px Arial, sans-serif; }
      .brand { fill: #111; font: italic 700 23px Arial, sans-serif; letter-spacing: -1.3px; }
      .technology { fill: #111; font: 700 6px Arial, sans-serif; letter-spacing: 3.1px; }
    </style>
  </defs>
  <rect class="panel" x=".8" y=".8" width="1198.4" height="243.4"/>
  <path class="line" d="M16 115 Q288 90 458 105M870 125 Q1040 125 1184 109"/>
